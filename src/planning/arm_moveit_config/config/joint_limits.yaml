# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.
# Set to 1.0 for maximum speed, or lower values (0.1-0.5) for safer/slower motion
default_velocity_scaling_factor: 1.0  # 100% - Full speed
default_acceleration_scaling_factor: 1.0  # 100% - Full acceleration

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
#
# Joint limits based on source robot URDF specifications
joint_limits:
  waist_yaw_joint_X8:
    has_velocity_limits: true
    max_velocity: 1.0  # rad/s (conservative limit for torso rotation)
    has_acceleration_limits: true
    max_acceleration: 2.0  # rad/s² (limits whole-upper-body acceleration)
  left_shoulder_pitch_joint_X6:
    has_velocity_limits: true
    max_velocity: 2.0  # rad/s (from URDF)
    has_acceleration_limits: true
    max_acceleration: 5.0  # rad/s² (shoulder pitch - moves entire arm)
  left_shoulder_roll_joint_X6:
    has_velocity_limits: true
    max_velocity: 2.0  # rad/s (from URDF)
    has_acceleration_limits: true
    max_acceleration: 5.0  # rad/s² (shoulder roll)
  left_shoulder_yaw_joint_X4:
    has_velocity_limits: true
    max_velocity: 2.0  # rad/s (from URDF)
    has_acceleration_limits: true
    max_acceleration: 5.0  # rad/s² (shoulder yaw)
  left_elbow_pitch_joint_X6:
    has_velocity_limits: true
    max_velocity: 2.0  # rad/s (from URDF)
    has_acceleration_limits: true
    max_acceleration: 5.0  # rad/s² (elbow pitch)
  left_wrist_yaw_joint_X4:
    has_velocity_limits: true
    max_velocity: 2.0  # rad/s (from URDF)
    has_acceleration_limits: true
    max_acceleration: 5.0  # rad/s² (wrist yaw)
  left_wrist_roll_joint_X4:
    has_velocity_limits: true
    max_velocity: 2.0  # rad/s (from URDF)
    has_acceleration_limits: true
    max_acceleration: 5.0  # rad/s² (wrist roll)
  left_thumb_proximal_yaw_joint:
    has_velocity_limits: true
    max_velocity: 2.0  # rad/s (raised from URDF 0.5 for a faster, snappier close)
    has_acceleration_limits: true
    max_acceleration: 10.0  # rad/s² (raised from 1.0 — low accel was the main slowdown)
  left_thumb_proximal_pitch_joint:
    has_velocity_limits: true
    max_velocity: 2.0  # rad/s (raised from URDF 0.5 for a faster, snappier close)
    has_acceleration_limits: true
    max_acceleration: 10.0  # rad/s² (raised from 1.0 — low accel was the main slowdown)
  left_index_proximal_joint:
    has_velocity_limits: true
    max_velocity: 2.0  # rad/s (raised from URDF 0.5 for a faster, snappier close)
    has_acceleration_limits: true
    max_acceleration: 10.0  # rad/s² (raised from 1.0 — low accel was the main slowdown)
  left_middle_proximal_joint:
    has_velocity_limits: true
    max_velocity: 2.0  # rad/s (raised from URDF 0.5 for a faster, snappier close)
    has_acceleration_limits: true
    max_acceleration: 10.0  # rad/s² (raised from 1.0 — low accel was the main slowdown)
  left_ring_proximal_joint:
    has_velocity_limits: true
    max_velocity: 2.0  # rad/s (raised from URDF 0.5 for a faster, snappier close)
    has_acceleration_limits: true
