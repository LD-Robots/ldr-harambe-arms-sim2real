# Single source of truth for the MTC pick-and-place task.
#
# Loaded by BOTH nodes via the /** wildcard; each declares only the keys it uses:
#   planning_scene_publisher.py  ->  robot.planning_frame, scene.*
#   mtc_pick_place               ->  robot.*, poses.*, task.*,
#                                    scene.object.id, scene.source_table.name
#
# Geometry is expressed in robot.planning_frame (urdf_base). The Gazebo world
# lab-mtc.sdf places the robot at world z = 0.85, so every Z below is the world
# value minus 0.85. Keep these in sync with the world file by hand -- they are
# two independent scenes (Gazebo physics vs MoveIt collision).
/**:
  ros__parameters:

    # ========== ROBOT / MODEL NAMES ==========
    robot:
      arm_group: "arm"                          # 7-DOF: waist yaw + left arm
      hand_group: "hand"
      hand_frame: "left_tcp_link"               # IK target frame
      hand_root_link: "left_hand_base_link"     # subtree root for collision allowances
      planning_frame: "urdf_base"
      waist_joint: "waist_yaw_joint_X8"
      # Arm joints, shoulder to wrist. Order must match task.cost.arm_weights.
      arm_joints:
        - "left_shoulder_pitch_joint_X6"
        - "left_shoulder_roll_joint_X6"
        - "left_shoulder_yaw_joint_X4"
        - "left_elbow_pitch_joint_X6"
        - "left_wrist_yaw_joint_X4"
        - "left_wrist_roll_joint_X4"

    # ========== SRDF NAMED STATES ==========
    poses:
      arm_home: "home"
      hand_open: "open"
      hand_pregrasp: "03_hand_cylinder_pregrasp"        # thumb rotated around the cylinder
      hand_grasp: "04_hand_cylinder_grasp"
      hand_release_partial: "07_hand_cylinder_release"  # thumb relaxes, fingers still support
      hand_release_full: "08_hand_cylinder_release"

    # ========== COLLISION SCENE ==========
    # Owned by planning_scene_publisher.py. The task node reads only the two
    # names it needs for collision allowances.
    scene:
      spawn_object: true
      spawn_tables: true
      # The scene is applied ONCE via the /apply_planning_scene service, which is
      # acknowledged, so periodic re-assertion is not needed and only makes
      # move_group log an update every cycle. Set > 0 only if something else in
      # the system clears the scene while the publisher keeps running.
      republish_period: 0.0     # s; 0 = apply once

      object:
        id: "target_cylinder"
        radius: 0.03035         # = Gazebo lever radius
        height: 0.15            # = Gazebo lever length
        pose: [0.45, 0.35, 0.175]     # lever world (0.45, 0.35, 1.025) - 0.85

      source_table:
        name: "table"
        pose: [0.45, 0.35, -0.375]    # test_table world (0.45, 0.35, 0.475) - 0.85
        size: [0.5, 0.3, 0.95]        # = Gazebo test_table size; top at 0.1

      destination_table:
        name: "destination_table"
        pose: [0.45, -0.35, -0.375]   # destination_table world (0.45, -0.35, 0.475) - 0.85
        size: [0.5, 0.3, 0.95]

    # ========== TASK TUNING ==========
    task:
      # Where the object ends up, in robot.planning_frame.
      place_pose: [0.45, -0.35, 0.175]

      grasp:
        # Tilt off straight-down, radians. A pure top grasp (tilt 0) sits at the
        # kinematic edge -- the arm reaches ~81 deg where the grasp needs 90 --
        # so the approach is tilted down-forward into the reachable set.
        tilt: 0.18
        # IK frame translation from the hand frame to the pre-grasp point.
        # x must exceed finger length (~0.05) so the OPEN hand sits in front of
        # the object rather than inside it.
        pre_grasp_offset: [0.035, 0.045, -0.03]
        angle_delta: 0.5235987755982988   # pi/6 -> 12 grasp poses around the cylinder
        max_ik_solutions: 4
        min_solution_distance: 0.1

      approach:
        min_distance: 0.0
        max_distance: 0.05      # brings the hand all the way in to the grasp

      lift:
        min_distance: 0.005     # 2 cm failed CartesianPath min_fraction and pruned grasp branches
        max_distance: 0.1

      retreat:
        min_distance: 0.02
        max_distance: 0.1

      place:
        n_angles: 6             # yaw candidates around the symmetric cylinder axis
        max_ik_solutions: 2
        min_solution_distance: 0.1

      # Weighted PathLength on both Connect stages, and DistanceToReference
      # pulling the waist toward zero on the grasp IK. These RANK solutions;
      # they do not steer the search -- MTC orders InterfaceStates by depth
      # before cost. arm_weights is parallel to robot.arm_joints.
      cost:
        waist_weight: 15.0
        arm_weights: [7.0, 7.0, 5.0, 3.0, 1.0, 1.0]

      planning:
        max_solutions: 5        # Task::plan stops here; raise to let cost ranking pick from more
        goal_joint_tolerance: 0.00001
        cartesian_step_size: 0.01
        scene_wait_timeout: 10.0   # s to wait for the scene publisher before planning
