# Collision-object scene for planning_scene_publisher.py.
#
# STALE: these values describe the old lab-ldr layout and do NOT match what
# mtc_pick_place publishes from setupPlanningScene() for lab-mtc.sdf --
# different frame (world vs urdf_base), different table pose and size,
# different cylinder name and radius. Reconciling the two into a single source
# of truth is tracked as part of the arm_mtc configuration cleanup.
#
# The grasp/motion/planner/poses/groups sections that used to live here were
# read by pick_place_task.cpp, which has been removed. Only the keys below are
# declared by planning_scene_publisher.py.
/**:
  ros__parameters:
    # ========== WORLD CONFIGURATION ==========
    world_frame: "world"

    # ========== TABLE CONFIGURATION ==========
    # Source table (where cylinder starts)
    source_table:
      name: "test_table"
      position:
        x: -0.30      # Aligned with lab-ldr world
        y: 0.35       # Right side (left arm natural reach)
        z: 0.2125     # Table center (height/2)
      dimensions:
        length: 0.45  # Front-to-back (X)
        width: 0.25   # Left-to-right (Y)
        thickness: 0.425  # Height (Z)

    # Destination table (where cylinder will be placed)
    destination_table:
      name: "destination_table"
      position:
        x: -0.30      # Moved farther (matches lab-ldr world)
        y: -0.35      # Left side (symmetric)
        z: 0.2125     # Same height (center)
      dimensions:
        length: 0.45
        width: 0.25
        thickness: 0.425

    # ========== OBJECT CONFIGURATION ==========
    # Cylinder object to grasp
    cylinder:
      name: "test_cylinder"
      dimensions:
        height: 0.15    # 15cm tall
        radius: 0.02025 # 2.025cm radius
      position_offset:
        x: 0.0          # Offset from table center (X)
        y: 0.0          # Offset from table center (Y)
