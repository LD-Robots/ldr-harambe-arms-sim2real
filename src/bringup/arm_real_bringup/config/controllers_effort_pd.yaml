# Effort PD controller for real hardware — Dual Arm (12 DOF)
# Drives must boot in CST mode (gravcomp:=true) for effort command interface.
# JTC internally computes: torque = Kp * (target - pos) - Kd * vel
#
# PD gains computed from URDF inertia + actuator specs (robot_tools/compute_pid_gains)
# at omega_n=30 rad/s, zeta=1.0 (critically damped), then converted to effort units.
#
# Usage:
#   ros2 launch arm_real_bringup effort_pd.launch.py

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — matches MyActuator 10 ms cycle
    thread_priority: 49

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      publish_rate: 100

    dual_arm_effort_controller:
      type: joint_trajectory_controller/JointTrajectoryController

dual_arm_effort_controller:
  ros__parameters:
    joints:
      # Left arm (0-5)
      - left_shoulder_pitch_joint_X6
      - left_shoulder_roll_joint_X6
      - left_shoulder_yaw_joint_X4
      - left_elbow_pitch_joint_X6
      - left_wrist_yaw_joint_X4
      - left_wrist_roll_joint_X4
      # Right arm (6-11)
      - right_shoulder_pitch_joint_X6
      - right_shoulder_roll_joint_X6
      - right_shoulder_yaw_joint_X4
      - right_elbow_pitch_joint_X6
      - right_wrist_yaw_joint_X4
      - right_wrist_roll_joint_X4

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    allow_nonzero_velocity_at_trajectory_end: true
    allow_integration_in_goal_trajectories: true
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.0  # don't check stop condition
      goal_time: 0.0                   # don't enforce goal time

    # PD gains — from compute_pid_gains (omega_n=15, zeta=0.7)
    # torque = p * (target - pos) - d * vel (computed at 100 Hz by controller)
    gains:
      # Left arm: X6 shoulders/elbow, X4 yaw/wrist
      left_shoulder_pitch_joint_X6: {p: 108.8, d: 10.2, i: 0.0}
      left_shoulder_roll_joint_X6:  {p: 109.9, d: 10.3, i: 0.0}
      left_shoulder_yaw_joint_X4:   {p: 23.2,  d: 2.2,  i: 0.0}
      left_elbow_pitch_joint_X6:    {p: 29.1,  d: 2.7,  i: 0.0}
      left_wrist_yaw_joint_X4:      {p: 9.6,   d: 0.9,  i: 0.0}
      left_wrist_roll_joint_X4:     {p: 11.3,  d: 1.1,  i: 0.0}
      # Right arm: same structure
      right_shoulder_pitch_joint_X6: {p: 108.8, d: 10.2, i: 0.0}
      right_shoulder_roll_joint_X6:  {p: 109.8, d: 10.2, i: 0.0}
      right_shoulder_yaw_joint_X4:   {p: 23.5,  d: 2.2,  i: 0.0}
      right_elbow_pitch_joint_X6:    {p: 29.9,  d: 2.8,  i: 0.0}
      right_wrist_yaw_joint_X4:      {p: 9.7,   d: 0.9,  i: 0.0}
      right_wrist_roll_joint_X4:     {p: 11.3,  d: 1.1,  i: 0.0}
