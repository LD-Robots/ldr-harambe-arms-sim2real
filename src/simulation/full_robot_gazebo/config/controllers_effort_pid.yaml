# Effort controller with JointTrajectoryController (has internal PID)
# PID runs inside controller_manager at update_rate — no ROS latency

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz — match Isaac Lab PhysX rate (needed for high Kp gains)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    whole_body_controller:
      type: joint_trajectory_controller/JointTrajectoryController

whole_body_controller:
  ros__parameters:
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    joints:
      # Left arm (0-5)
      - left_shoulder_pitch_joint_X6
      - left_shoulder_roll_joint_X6
      - left_shoulder_yaw_joint_X4
      - left_elbow_pitch_joint_X6
      - left_wrist_yaw_joint_X4
      - left_wrist_roll_joint_X4
      # Right arm (6-11)
      - right_shoulder_pitch_joint_X6
      - right_shoulder_roll_joint_X6
      - right_shoulder_yaw_joint_X4
      - right_elbow_pitch_joint_X6
      - right_wrist_yaw_joint_X4
      - right_wrist_roll_joint_X4
      # Waist (12)
      - waist_yaw_joint_X8
      # Left leg (13-18)
      - left_hip_pitch_joint_X8
      - left_hip_roll_joint_X8
      - left_hip_yaw_joint_X8
      - left_knee_joint_X8
      - left_ankle_pitch_joint_X4
      - left_ankle_roll_joint_X4
      # Right leg (19-24)
      - right_hip_pitch_joint_X8
      - right_hip_roll_joint_X8
      - right_hip_yaw_joint_X8
      - right_knee_joint_X8
      - right_ankle_pitch_joint_X4
      - right_ankle_roll_joint_X4

    # PID gains from ActuatorCfg identification (v11)
    # These run INSIDE controller_manager at 1000Hz — no ROS latency
    gains:
      # Left arm
      left_shoulder_pitch_joint_X6: {p: 114.3, d: 10.7, i: 0.0, i_clamp: 0.0}
      left_shoulder_roll_joint_X6:  {p: 115.4, d: 10.8, i: 0.0, i_clamp: 0.0}
      left_shoulder_yaw_joint_X4:   {p: 22.0,  d: 2.1,  i: 0.0, i_clamp: 0.0}
      left_elbow_pitch_joint_X6:    {p: 30.6,  d: 2.9,  i: 0.0, i_clamp: 0.0}
      left_wrist_yaw_joint_X4:      {p: 9.1,   d: 0.9,  i: 0.0, i_clamp: 0.0}
      left_wrist_roll_joint_X4:     {p: 10.8,  d: 1.0,  i: 0.0, i_clamp: 0.0}
      # Right arm
      right_shoulder_pitch_joint_X6: {p: 114.3, d: 10.7, i: 0.0, i_clamp: 0.0}
      right_shoulder_roll_joint_X6:  {p: 115.2, d: 10.8, i: 0.0, i_clamp: 0.0}
      right_shoulder_yaw_joint_X4:   {p: 22.3,  d: 2.1,  i: 0.0, i_clamp: 0.0}
      right_elbow_pitch_joint_X6:    {p: 31.4,  d: 2.9,  i: 0.0, i_clamp: 0.0}
      right_wrist_yaw_joint_X4:      {p: 9.2,   d: 0.9,  i: 0.0, i_clamp: 0.0}
      right_wrist_roll_joint_X4:     {p: 10.8,  d: 1.0,  i: 0.0, i_clamp: 0.0}
      # Waist
      waist_yaw_joint_X8:            {p: 91.7,  d: 8.6,  i: 0.0, i_clamp: 0.0}
      # Left leg
      left_hip_pitch_joint_X8:       {p: 466.2, d: 32.6, i: 0.0, i_clamp: 0.0}
      left_hip_roll_joint_X8:        {p: 464.4, d: 32.5, i: 0.0, i_clamp: 0.0}
      left_hip_yaw_joint_X8:         {p: 75.7,  d: 5.3,  i: 0.0, i_clamp: 0.0}
      left_knee_joint_X8:            {p: 97.3,  d: 6.8,  i: 0.0, i_clamp: 0.0}
      left_ankle_pitch_joint_X4:     {p: 996.2, d: 69.7, i: 0.0, i_clamp: 0.0}
      left_ankle_roll_joint_X4:      {p: 89.7,  d: 6.3,  i: 0.0, i_clamp: 0.0}
      # Right leg
      right_hip_pitch_joint_X8:      {p: 465.4, d: 32.6, i: 0.0, i_clamp: 0.0}
      right_hip_roll_joint_X8:       {p: 463.7, d: 32.5, i: 0.0, i_clamp: 0.0}
      right_hip_yaw_joint_X8:        {p: 75.6,  d: 5.3,  i: 0.0, i_clamp: 0.0}
      right_knee_joint_X8:           {p: 97.3,  d: 6.8,  i: 0.0, i_clamp: 0.0}
      right_ankle_pitch_joint_X4:    {p: 996.1, d: 69.7, i: 0.0, i_clamp: 0.0}
      right_ankle_roll_joint_X4:     {p: 90.0,  d: 6.3,  i: 0.0, i_clamp: 0.0}

    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
    open_loop_control: false
